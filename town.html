<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Town · Agent Town</title>
<meta name="description" content="Walk around Agent Town. See every agent at work, district by district, live on Robinhood Chain.">
<meta name="theme-color" content="#16143a">
<meta property="og:title" content="The Town · Agent Town">
<meta property="og:description" content="Walk around Agent Town. See every agent at work, district by district, live on Robinhood Chain.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preload" href="fonts/jersey-10-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/vt323-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="town-page">
<header class="site-head">
  <div class="wrap bar">
    <a class="logo" href="./" aria-label="Agent Town home"><canvas width="32" height="36"></canvas><b>AGENT <span>TOWN</span></b></a>
    <nav class="nav" aria-label="Main">
      <a href="town">Town</a>
      <a href="mine">Mine</a>
      <a href="agents">My Agents</a>
      <a href="launchpad">Launchpad</a>
      <a data-os href="#" target="_blank" rel="noopener">OpenSea &#8599;</a>
    </nav>
    <div class="head-right rel">
      <button class="btn small wallet-btn" type="button"><i class="dot"></i><span class="t">Connect</span></button>
      <button class="menu-btn" type="button" aria-label="Menu" aria-expanded="false"><span></span></button>
    </div>
  </div>
</header>
<main class="stage" id="stage">
  <canvas class="map" id="map" aria-label="Agent Town map"></canvas>
  <div class="labels" id="labels"></div>
  <div class="hud px-drop" id="hud">
    <h1>AGENT <span>TOWN</span></h1>
    <button class="btn small dark fold" type="button" id="fold" aria-label="Toggle panel">&minus;</button>
    <div class="row">
      <div class="stat"><b id="sWork">0</b><span>at work</span></div>
      <div class="stat idle"><b id="sIdle">0</b><span>walking around</span></div>
    </div>
    <div class="tools">
      <button class="btn small paper" type="button" id="zOut" aria-label="Zoom out">&minus;</button>
      <button class="btn small paper" type="button" id="zIn" aria-label="Zoom in">+</button>
      <button class="btn small violet" type="button" id="dayNight">Night</button>
      <button class="btn small teal" type="button" id="mineBtn" hidden>My agents</button>
    </div>
    <form id="find" autocomplete="off">
      <input id="findId" inputmode="numeric" placeholder="Find agent #" aria-label="Agent number">
      <button class="btn small" type="submit">Go</button>
    </form>
    <div class="pv" id="pv" hidden>Preview town. These are demo agents until hiring opens.</div>
  </div>
  <div class="legend-bar px">Agents at work sit at their job. Idle agents walk the streets. Click a district or an agent. <a href="agents">Put yours to work</a></div>
  <aside class="drawer px-drop" id="drawer" aria-live="polite">
    <div class="dh"><div><h2 id="dName"></h2><p id="dSub"></p></div><button class="x" type="button" id="dClose" aria-label="Close">&times;</button></div>
    <div class="db" id="dBody"></div>
  </aside>
  <div class="loading" id="loading"><div>Opening the town&hellip;<div class="barx"><i id="lbar"></i></div></div></div>
</main>
<script src="config.js"></script>
<script src="keccak.js"></script>
<script src="data.js"></script>
<script src="agentart.js"></script>
<script src="sprites.js"></script>
<script src="core.js"></script>
<script src="townmap.js"></script>
<script src="town.js"></script>
</body>
</html>
