<script>
(function () {
  var parts = location.pathname.split("/").filter(Boolean);
  var root = /github\.io$/.test(location.hostname) && parts.length ? "/" + parts[0] + "/" : "/";
  var rest = location.pathname.slice(root.length).replace(/\/+$/, "").replace(/\/index$/i, "").replace(/\.html$/i, "").toLowerCase();
  if (/^(town|mine|agents|launchpad|create|token)$/.test(rest) && location.pathname !== root + rest) { location.replace(root + rest + location.search + location.hash); return; }
  document.write('<base href="' + root + '">');
})();
</script>
